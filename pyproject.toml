[build-system]
requires = ["scikit-build-core>=0.11,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "doc2struct"
dynamic = ["version"]
description = "Parse HTML, PDF, text, and partial SGML into structured documents in C and Python."
readme = "readme.md"
requires-python = ">=3.10"
authors = [{name = "John Friedman"}]
license = "MIT"
license-files = ["LICENSE", "c/vendor/pcre2/LICENCE.md", "c/vendor/pdfium/LICENSE"]
classifiers = [
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/john-friedman/doc2struct"
Source = "https://github.com/john-friedman/doc2struct"
Issues = "https://github.com/john-friedman/doc2struct/issues"

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/src/doc2struct"]
wheel.exclude = ["**/__pycache__/**"]
install.components = ["python"]
sdist.include = ["/CMakeLists.txt", "/LICENSE", "/c/**", "/presets/*.json", "/python/native/*.c", "/python/src/doc2struct/**/*.py", "/python/tests/*.py", "/build_scripts/*.py"]
sdist.exclude = ["build/**", "dist/**", "python/_native_source/**", "python/build/**", "python/src/doc2struct/_pdfium/**", "**/__pycache__/**", "*.egg-info/**", "testing/**", "data/**", "image.png"]

[tool.scikit-build.cmake.define]
DOC2STRUCT_BUILD_PYTHON = "ON"
DOC2STRUCT_BUILD_CLI = "OFF"

# The public C version is also the Python distribution version.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "c/include/doc2struct/doc2struct.h"
regex = '#define DOC2STRUCT_VERSION "(?P<value>[^\"]+)"'

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-command = "python {project}/build_scripts/smoke_release.py --python && python -m unittest discover -s {project}/python/tests"
repair-wheel-command = "python {project}/build_scripts/repair_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET = "14.0"}
